<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LN4 Triage System (C++ Backend)</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lucide icons from CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Main Column -->
        <div style="display: flex; flex-direction: column;">
            
            <!-- Header -->
            <header class="f1-header">
                <div class="pulse-heart heart-box">
                    <div style="transform: skewX(15deg)">
                        <i data-lucide="activity" style="color:#000; width:32px; height:32px;"></i>
                    </div>
                </div>
                <div class="header-title-box">
                    <h1 class="header-title">MV1 HOSPITAL TRIAGE DASHBOARD</h1>
                </div>
            </header>

            <!-- Dashboard Stats -->
            <div class="dashboard-grid">
                <div class="f1-panel stat-panel" style="border-left-color: var(--accent-color);">
                    <p class="stat-label">UNITS WAITING</p>
                    <h2 class="stat-number" id="stat-waiting" style="text-shadow: 0 0 10px rgba(255,255,255,0.2);">0</h2>
                </div>
                <div class="f1-panel stat-panel" style="border-left-color: #10b981;">
                    <p class="stat-label">UNITS TREATED</p>
                    <h2 class="stat-number" id="stat-treated" style="color: #10b981; text-shadow: 0 0 10px rgba(16, 185, 129, 0.4);">0</h2>
                </div>
                <div class="f1-panel stat-panel" style="border-left-color: var(--severity-critical);">
                    <p class="stat-label">CRITICAL PENDING</p>
                    <h2 class="stat-number" id="stat-critical" style="color: var(--severity-critical); text-shadow: 0 0 15px rgba(239, 68, 68, 0.5);">0</h2>
                </div>
                <div class="f1-panel stat-panel" style="border-left-color: var(--severity-low);">
                    <p class="stat-label">BEDS AVAILABLE</p>
                    <h2 class="stat-number" id="stat-beds" style="color: var(--severity-low); text-shadow: 0 0 10px rgba(59, 130, 246, 0.4);">30</h2>
                </div>
            </div>

            <!-- Queue List -->
            <div style="flex: 1; margin-top: 2rem;">
                <div class="queue-header">
                    <h2 style="font-size: 2rem; margin: 0; font-style: italic; color: var(--text-main);">LIVE QUEUE</h2>
                    <span class="queue-badge">
                        <div style="transform: skewX(15deg)" id="queue-count">
                            0 UNITS
                        </div>
                    </span>
                </div>
                <div id="queue-container" style="display: flex; flex-direction: column; gap: 0;">
                    <!-- Patient cards injected via JS -->
                    <div id="empty-state" class="f1-panel" style="padding: 3rem; text-align: center; color: var(--text-muted); border-left-color: var(--border-color); font-family: 'Teko', sans-serif; font-size: 1.5rem;">
                        NO ACTIVE INCIDENTS. AWAITING TELEMETRY.
                    </div>
                </div>
            </div>
        </div>

        <!-- Side Column -->
        <div>
            <!-- Control Panel -->
            <div class="f1-panel" style="padding: 1.5rem; margin-bottom: 2rem; border-left-color: var(--accent-color);">
                <h3 style="margin-bottom: 1.5rem; font-size: 1.75rem; color: var(--text-main);">COMMAND CENTER</h3>
                <div style="display: flex; flex-direction: column; gap: 1rem; align-items: flex-start;">
                    <button class="btn-secondary" id="btn-simulate">
                        <div><i data-lucide="play" width="18" height="18"></i> GENERATE INCIDENTS</div>
                    </button>
                    <button class="btn-primary" id="btn-process" disabled>
                        <div><i data-lucide="arrow-right" width="18" height="18"></i> PROCESS NEXT UNIT</div>
                    </button>
                    <button class="btn-secondary" id="btn-discharge" disabled style="border-color: var(--severity-low);">
                        <div style="color: var(--severity-low);"><i data-lucide="user-check" width="18" height="18"></i> DISCHARGE TREATED</div>
                    </button>
                </div>
            </div>

            <!-- Resource Panel -->
            <div class="f1-panel" style="padding: 1.5rem; border-left-color: var(--text-muted);">
                <h3 style="margin-bottom: 1.5rem; font-size: 1.75rem;">RESOURCE TELEMETRY</h3>
                
                <div style="margin-bottom: 1.5rem;">
                    <h4 style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 1.25rem;">
                        <i data-lucide="stethoscope" width="18" height="18"></i> MEDICAL STAFF
                    </h4>
                    <div id="doctors-container" style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <!-- Doctors injected via JS -->
                    </div>
                </div>

                <div>
                    <h4 style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 1.25rem;">
                        <i data-lucide="bed-double" width="18" height="18"></i> WARD CAPACITY
                    </h4>
                    <div id="wards-container" style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <!-- Wards injected via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
